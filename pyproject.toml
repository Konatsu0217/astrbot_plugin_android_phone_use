[project]
name = "astrbot-plugin-android-phone-use"
version = "0.1.1"
description = "AstrBot tools for user-enabled Android phone-control sessions"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = ["mcp>=1.8.0,<2"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
